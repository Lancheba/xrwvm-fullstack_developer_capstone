name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python code
        run: flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=djangoenv,venv,node_modules

      - name: Show Django app files
        run: ls server/djangoapp

      - name: Workflow finished
        run: echo "CI/CD workflow completed successfully"
